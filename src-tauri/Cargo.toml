[package]
name = "wall-painter"
version = "0.1.0"
description = "Paint the walls in your room photos"
edition = "2021"

[lib]
name = "wall_painter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
