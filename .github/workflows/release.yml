name: Release

# Builds installers for every platform and attaches them to a GitHub Release.
# Runs when you push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# or when started by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

          - name: Windows (x64)
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

          # Cross-compiled on the x64 runner; NSIS is the installer type
          # Tauri supports for ARM64 cross builds.
          - name: Windows (ARM64)
            runner: windows-latest
            rust-target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis

          - name: Linux (x64)
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu

          - name: Linux (ARM64)
            runner: ubuntu-22.04-arm
            rust-target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced with the version from tauri.conf.json
          tagName: v__VERSION__
          releaseName: Wall Painter v__VERSION__
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
